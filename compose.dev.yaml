# Purpose: Development Docker Compose foundation for local JIMPITAN container checks.
# Caller: Developers who want local containers without changing npm-based development.
# Deps: API/web/worker Dockerfiles, PostgreSQL, Redis, and Nginx config.
# MainFuncs: Defines all services with explicit localhost ports for development diagnostics.
# SideEffects: Creates local containers, networks, and named volumes.

name: jimpitan-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jimpitan}
      POSTGRES_USER: ${POSTGRES_USER:-jimpitan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jimpitan}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-env.example}
    environment:
      NODE_ENV: development
      APP_ENV: local
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-jimpitan}:${POSTGRES_PASSWORD:-jimpitan}@postgres:5432/${POSTGRES_DB:-jimpitan}?schema=public
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      TRUST_PROXY_HOPS: 1
      SWAGGER_ENABLED: "true"
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - upload_dev_data:/var/lib/jimpitan/uploads
      - export_dev_data:/var/lib/jimpitan/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const req=http.get('http://127.0.0.1:3001/api/v1/health',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.setTimeout(4000,()=>{req.destroy();process.exit(1);});"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    networks:
      - internal

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-env.example}
    environment:
      NODE_ENV: development
      APP_ENV: local
      DATABASE_URL: postgresql://${POSTGRES_USER:-jimpitan}:${POSTGRES_PASSWORD:-jimpitan}@postgres:5432/${POSTGRES_DB:-jimpitan}?schema=public
      REDIS_URL: redis://redis:6379
      WORKER_QUEUES: ${WORKER_QUEUES:-notification-outbox,report-exports,telegram-delivery}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-10}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_STALE_JOB_MS: ${WORKER_STALE_JOB_MS:-900000}
      WORKER_HEALTH_FILE: /tmp/jimpitan-worker-health
    volumes:
      - upload_dev_data:/var/lib/jimpitan/uploads
      - export_dev_data:/var/lib/jimpitan/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const f=process.env.WORKER_HEALTH_FILE||'/tmp/jimpitan-worker-health';const s=fs.statSync(f);const max=Number(process.env.WORKER_POLL_INTERVAL_MS||5000)*4+10000;process.exit(Date.now()-s.mtimeMs<=max?0:1);"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-env.example}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const req=http.get('http://127.0.0.1:3000/api/health',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.setTimeout(4000,()=>{req.destroy();process.exit(1);});"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal

volumes:
  postgres_dev_data:
  redis_dev_data:
  upload_dev_data:
  export_dev_data:

networks:
  internal:
    driver: bridge
