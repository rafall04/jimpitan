# Purpose: GitHub Actions CI for JIMPITAN MVP launch readiness.
# Caller: GitHub pull_request and main branch push events.
# Deps: Node.js 20, PostgreSQL service, npm scripts, Prisma, Playwright, and Docker on GitHub hosted runners.
# MainFuncs: Runs unit tests, type/build checks, import/infra/readiness scans, Docker config, and E2E with artifacts.
# SideEffects: Creates ephemeral CI database schema and uploads Playwright artifacts on failure.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jimpitan_e2e
          POSTGRES_USER: jimpitan
          POSTGRES_PASSWORD: jimpitan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jimpitan -d jimpitan_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://jimpitan:jimpitan@127.0.0.1:5432/jimpitan_e2e?schema=public
      E2E_DATABASE_URL: postgresql://jimpitan:jimpitan@127.0.0.1:5432/jimpitan_e2e?schema=public
      E2E_BASE_URL: http://127.0.0.1:3100
      E2E_API_BASE_URL: http://127.0.0.1:3101/api/v1
      E2E_ADMIN_PASSWORD: E2ePassword123!
      E2E_BENDAHARA_PASSWORD: E2ePassword123!
      E2E_NAMESPACE: ci-${{ github.run_id }}
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3101/api/v1
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      POSTGRES_DB: jimpitan
      POSTGRES_USER: jimpitan
      POSTGRES_PASSWORD: replace-with-private-postgres-password
      HTTP_PORT: 80
      APP_ENV_FILE: .env.example

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run prisma:generate

      - run: npm run prisma:validate

      - run: npm run test:api

      - run: npm run test:web

      - run: npm run typecheck:web

      - run: npm run build:api

      - run: npm run build:worker

      - run: npm run build:web

      - run: npm run scan:imports

      - run: npm run infra:check

      - run: npm run readiness:check

      - run: npm run docker:config:prod

      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
