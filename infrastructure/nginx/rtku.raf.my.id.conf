# Purpose: Host-Nginx vhost for single-origin RTku (JIMPITAN) access behind a Cloudflare Tunnel.
# Caller: System nginx on the VPS (symlinked into /etc/nginx/sites-enabled/). cloudflared ingress: rtku.raf.my.id -> http://localhost:8090.
# Deps: Local web container (127.0.0.1:3100) and API container (127.0.0.1:3101).
# MainFuncs: Same-origin routing — /api/v1/* -> backend API; everything else (incl. Next BFF /api/auth, /api/backend, /api/health) -> web.
# SideEffects: Listens on 127.0.0.1:8090 only (plain HTTP; TLS is terminated at the Cloudflare edge, so the port is never exposed publicly).

server {
    # Loopback-only: reachable solely by the local cloudflared tunnel, never the LAN/internet.
    listen 127.0.0.1:8090;
    server_name rtku.raf.my.id;

    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Backend API (same-origin). Must precede "/". Also serves /api/v1/attachments/public/* images.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        # Public scheme is HTTPS (terminated by Cloudflare) — advertise it so the API/BFF emit secure cookies + correct redirects.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Next.js web app + its same-origin BFF (/api/auth, /api/backend, /api/health) and every page route.
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/rtku-access.log;
    error_log /var/log/nginx/rtku-error.log warn;
}
