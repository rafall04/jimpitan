# Purpose: Production Docker Compose foundation for a VPS-hosted JIMPITAN deployment.
# Caller: Operators running docker compose on a VPS.
# Deps: API/web/worker Dockerfiles, PostgreSQL, Redis, Nginx config, and an env file.
# MainFuncs: Defines production services, internal networking, health checks, restart policies, and persistent volumes.
# SideEffects: Creates containers, networks, and named volumes.

name: jimpitan

x-app-env: &app-env
  NODE_ENV: production
  APP_ENV: production
  API_PORT: 3001
  API_PREFIX: api
  API_VERSION: 1
  DATABASE_URL: postgresql://${POSTGRES_USER:-jimpitan}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-jimpitan}?schema=public
  REDIS_URL: redis://redis:6379
  UPLOAD_STORAGE_PATH: /var/lib/jimpitan/uploads
  EXPORT_STORAGE_PATH: /var/lib/jimpitan/exports
  TRUST_PROXY_HOPS: 1
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  WORKER_STALE_JOB_MS: ${WORKER_STALE_JOB_MS:-900000}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jimpitan}
      POSTGRES_USER: ${POSTGRES_USER:-jimpitan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:?APP_ENV_FILE must point to a private production env file}
    environment:
      <<: *app-env
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - upload_data:/var/lib/jimpitan/uploads
      - export_data:/var/lib/jimpitan/exports
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const req=http.get('http://127.0.0.1:3001/api/v1/health/ready',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.setTimeout(4000,()=>{req.destroy();process.exit(1);});"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    networks:
      - internal

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:?APP_ENV_FILE must point to a private production env file}
    environment:
      <<: *app-env
      WORKER_QUEUES: ${WORKER_QUEUES:-notification-outbox,report-exports,telegram-delivery}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-20}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_STALE_JOB_MS: ${WORKER_STALE_JOB_MS:-900000}
      WORKER_HEALTH_FILE: /tmp/jimpitan-worker-health
    volumes:
      - upload_data:/var/lib/jimpitan/uploads
      - export_data:/var/lib/jimpitan/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const f=process.env.WORKER_HEALTH_FILE||'/tmp/jimpitan-worker-health';const s=fs.statSync(f);const max=Number(process.env.WORKER_POLL_INTERVAL_MS||5000)*4+10000;process.exit(Date.now()-s.mtimeMs<=max?0:1);"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:?APP_ENV_FILE must point to a private production env file}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const req=http.get('http://127.0.0.1:3000/api/health',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.setTimeout(4000,()=>{req.destroy();process.exit(1);});"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  upload_data:
  export_data:

networks:
  internal:
    driver: bridge
